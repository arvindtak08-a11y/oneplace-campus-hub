const seed={role:'student',notices:[{id:'n1',title:'Mid-semester examination timetable released',content:'The examination cell has published the provisional timetable for all undergraduate programmes. Review your course schedule and report clashes by Friday.',category:'Examination',publisher:'Examination Cell',date:'2026-10-15',urgent:true},{id:'n2',title:'Research assistant applications open',content:'CSE invites applications for two undergraduate research assistant positions in applied machine learning.',category:'Academic',publisher:'Department of CSE',date:'2026-10-14'},{id:'n3',title:'Career fair registration closes this week',content:'Meet 30+ employers at the annual campus career fair. Bring your updated resume and student ID.',category:'Placements',publisher:'Career Development Office',date:'2026-10-13',urgent:true},{id:'n4',title:'Campus theatre festival auditions',content:'Auditions are open to all students. Sign up for a time slot with the Cultural Society.',category:'Events',publisher:'Cultural Society',date:'2026-10-12'}],events:[{id:'e1',title:'Buildathon 2026',category:'Technical',date:'2026-10-24',time:'9:00 AM',venue:'Innovation Lab',total:100,taken:58,deadline:'2026-10-22',organizer:'CodeForge',description:'A 24-hour campus hackathon to turn bold ideas into working prototypes.'},{id:'e2',title:'Design Systems Workshop',category:'Workshops',date:'2026-10-20',time:'2:00 PM',venue:'Library Studio 3',total:40,taken:28,deadline:'2026-10-19',organizer:'Design Collective',description:'Hands-on workshop covering tokens, components, and accessibility.'},{id:'e3',title:'Aurora Cultural Night',category:'Cultural',date:'2026-10-29',time:'6:30 PM',venue:'Open Air Theatre',total:350,taken:211,deadline:'2026-10-27',organizer:'Cultural Society',description:'An evening of music, dance, and campus performances.'},{id:'e4',title:'Robotics Meet',category:'Technical',date:'2026-11-04',time:'10:00 AM',venue:'Engineering Block',total:80,taken:79,deadline:'2026-10-30',organizer:'RoboWorks',description:'Showcase autonomous builds and compete with teams across the region.'},{id:'e5',title:'Campus 5K Run',category:'Sports',date:'2026-10-26',time:'7:00 AM',venue:'East Gate',total:200,taken:84,deadline:'2026-10-24',organizer:'Athletics Club',description:'A relaxed 5K route open to runners of every level.'}],clubs:[{id:'c1',name:'CodeForge',category:'Coding',description:'Building useful software and a welcoming community of makers. Weekly build sessions and peer learning.',advisor:'Dr. Maya Patel',leads:'Aarav Mehta · Leena Das',recruiting:true},{id:'c2',name:'RoboWorks',category:'Robotics',description:'From sensors to autonomous rovers, we learn by designing, building, and testing real robots.',advisor:'Prof. K. Raman',leads:'Ishaan Roy · Mira Sen',recruiting:true},{id:'c3',name:'Frame by Frame',category:'Photography',description:'A creative home for photographers, filmmakers, and visual storytellers.',advisor:'Ms. Nisha Rao',leads:'Tara Bose · Kabir Shah',recruiting:false},{id:'c4',name:'Cultural Society',category:'Cultural',description:'Celebrating campus voices through music, dance, theatre, and festivals.',advisor:'Dr. Reena Nair',leads:'Zoya Ali · Dev Kulkarni',recruiting:true},{id:'c5',name:'Athletics Club',category:'Sports',description:'Helping every student find a sport, move more, and compete as a team.',advisor:'Coach R. Joseph',leads:'Ananya Rao · Neil Thomas',recruiting:false}],opportunities:[{id:'o1',title:'Frontend Engineering Intern',type:'Internships',org:'Northstar Labs',reward:'₹35,000 / month',deadline:'2026-10-30',skills:['React','TypeScript','CSS'],dept:'Computer Science',year:'2nd, 3rd Year',location:'Remote'},{id:'o2',title:'Campus Product Challenge',type:'Hackathons',org:'Build India',reward:'₹1,00,000 prize',deadline:'2026-10-25',skills:['Product','Prototyping'],dept:'All Departments',year:'All Years',location:'On-Campus'},{id:'o3',title:'Junior Data Analyst',type:'Placements',org:'Meridian Analytics',reward:'₹9.5 LPA',deadline:'2026-11-05',skills:['SQL','Python','Statistics'],dept:'Computer Science',year:'3rd, 4th Year',location:'On-Campus'},{id:'o4',title:'Undergraduate Research Fellowship',type:'Research/Scholarships',org:'Institute Research Office',reward:'₹20,000 grant',deadline:'2026-11-12',skills:['Research','Writing','ML'],dept:'Computer Science',year:'2nd, 3rd Year',location:'On-Campus'},{id:'o5',title:'Student Paper Symposium',type:'Paper Presentations',org:'Academic Council',reward:'Travel grant',deadline:'2026-11-18',skills:['Research','Presentation'],dept:'All Departments',year:'All Years',location:'On-Campus'}],regs:[],saved:{notices:[],opportunities:[]},apps:{},notifications:[{id:'x1',title:'Timetable published',message:'Your mid-semester timetable is ready to review.',date:'2026-10-15',read:false,type:'Notice'},{id:'x2',title:'Buildathon registration reminder',message:'Registration closes on October 22. Save your place.',date:'2026-10-15',read:false,type:'Reminder'},{id:'x3',title:'Research fellowship deadline',message:'Applications close in 27 days.',date:'2026-10-14',read:true,type:'Deadline'}],checked:[]};
function initial(){try{return {...seed,...JSON.parse(localStorage.getItem('oneplace-v1'))}}catch{return seed}}const fmt=d=>new Date(d+'T12:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'}),left=d=>Math.ceil((new Date(d+'T23:59')-new Date())/86400000),uid=()=>Math.random().toString(36).slice(2,9);
const nav=[['dashboard','⌂','Dashboard'],['notices','▤','Notices'],['events','▦','Events Calendar'],['clubs','♧','Clubs & Societies'],['opportunities','✧','Opportunities Hub'],['saved','♡','Saved & Planner'],['notifications','◉','Notifications'],['admin','⚙','Admin Panel']];

async function localPasswordHash(password,saltHex){const salt=new Uint8Array(saltHex.match(/.{2}/g).map(x=>parseInt(x,16))),key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']),bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:120000,hash:'SHA-256'},key,256);return Array.from(new Uint8Array(bits),b=>b.toString(16).padStart(2,'0')).join('')}
function AuthScreen({authMode,AM,authError,authenticate}){return <main className="auth-shell"><section className="auth-hero"><div className="auth-brand"><span className="mark">◈</span> OnePlace<span style={{color:'#0d9488'}}>.</span></div><h1>Your campus life, in one place.</h1><p>Keep up with verified notices, find events, discover opportunities, and track your applications—all from one campus hub.</p><div className="grid g3" style={{marginTop:24,maxWidth:560}}>{[['▤','Verified notices'],['▦','Events & passes'],['✧','Opportunities']].map(x=><div key={x[1]} className="card"><span className="ico">{x[0]}</span><div style={{fontSize:11,fontWeight:700,marginTop:9}}>{x[1]}</div></div>)}</div></section><section className="card auth-card"><div className="eyebrow">Welcome to OnePlace</div><h2 className="section" style={{fontSize:20}}>{authMode==='signup'?'Create a profile':'Sign in on this device'}</h2><p className="sub">{authMode==='signup'?'Set up your campus profile for this browser.':'Use the profile you created on this browser.'}</p><div className="auth-tabs"><button type="button" className={authMode==='signin'?'on':''} onClick={()=>AM('signin')}>Sign in</button><button type="button" className={authMode==='signup'?'on':''} onClick={()=>AM('signup')}>Sign up</button></div>{authError&&<div className="auth-error" role="alert">{authError}</div>}<form onSubmit={authenticate}>{authMode==='signup'&&<><div className="field"><label htmlFor="auth-name">Full name</label><input id="auth-name" className="input" name="name" autoComplete="name" required placeholder="Your name"/></div><div className="grid g2"><div className="field"><label htmlFor="auth-department">Department</label><select id="auth-department" className="select" name="department"><option>Computer Science</option><option>Engineering</option><option>Business</option><option>Arts & Humanities</option><option>Sciences</option><option>Other</option></select></div><div className="field"><label htmlFor="auth-year">Year</label><select id="auth-year" className="select" name="year"><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option><option>Graduate</option></select></div></div></>}<div className="field"><label htmlFor="auth-email">Campus email</label><input id="auth-email" className="input" name="email" type="email" autoComplete="email" required placeholder="you@campus.edu"/></div><div className="field"><label htmlFor="auth-password">Password</label><input id="auth-password" className="input" name="password" type="password" autoComplete={authMode==='signup'?'new-password':'current-password'} minLength="8" required placeholder="At least 8 characters"/></div><button className="btn primary" style={{width:'100%',marginTop:5}}>{authMode==='signup'?'Create device profile':'Sign in'}</button></form><div className="auth-note" style={{marginTop:15}}>Device-local demo: profile and campus activity stay in this browser; they don’t sync across devices. Passwords are salted and hashed locally. This is not a production identity service.</div></section></main>}

function App(){const [d,D]=S(initial),[page,P]=S('dashboard'),[filter,F]=S('All'),[search,Q]=S(''),[modal,M]=S(null),[toast,T]=S(''),[drawer,Dr]=S(false),[type,Ty]=S('All'),[view,V]=S('List'),[nf,NF]=S('All'),[ticket,Ticket]=S(''),[user,U]=S(()=>{try{return JSON.parse(localStorage.getItem('oneplace-device-session-v1'))}catch{return null}}),[authMode,AM]=S('signin'),[authError,AE]=S('');E(()=>localStorage.setItem('oneplace-v1',JSON.stringify(d)),[d]);E(()=>{if(toast){let t=setTimeout(()=>T(''),2500);return()=>clearTimeout(t)}},[toast]);E(()=>{let f=e=>{if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();M({type:'search'})}if(e.key==='Escape'){M(null);Dr(false)}};window.addEventListener('keydown',f);return()=>window.removeEventListener('keydown',f)},[]);let ping=x=>T(x),go=x=>{P(x);F('All');Q('');Dr(false)};function change(fn){D(x=>fn({...x}))}let unread=d.notifications.filter(n=>!n.read).length;
function bookmark(kind,x){change(a=>{let list=a.saved[kind];a.saved[kind]=list.includes(x.id)?list.filter(i=>i!==x.id):[...list,x.id];return a});ping(d.saved[kind].includes(x.id)?'Removed from saved items':'Saved for later')}
function reg(e){let r=d.regs.find(x=>x.eventId===e.id);if(r){change(a=>{a.regs=a.regs.filter(x=>x.eventId!==e.id);a.events.find(x=>x.id===e.id).taken--;return a});ping('Registration cancelled')}else if(e.taken>=e.total)ping('This event is full');else{change(a=>{a.regs.push({id:uid(),eventId:e.id,ticket:'OP-'+uid().toUpperCase(),checked:false});a.events.find(x=>x.id===e.id).taken++;return a});ping('You’re registered! Your pass is ready.')}}

function Stat({label,value,icon}){return <div className="card"><div className="stat"><div>{label}<div className="val">{value}</div></div><span className="ico">{icon}</span></div></div>}

function Notice({n}){return <article className="card lift"><div className="row"><span className={'pill '+(n.urgent?'red':'teal')}>{n.urgent?'Urgent':n.category}</span><button className="btn small" aria-label="Bookmark" onClick={()=>bookmark('notices',n)}>{d.saved.notices.includes(n.id)?'♥':'♡'}</button></div><div style={{marginTop:10}}><span className="verified">✓ Verified · {n.publisher}</span></div><h3 className="item">{n.title}</h3><div className="copy">{n.content}</div><div className="meta">◷ {fmt(n.date)} · {n.category}</div><hr className="divider"/><div className="row"><button className="btn small" onClick={()=>ping('Attachment ready: notice.pdf')}>↓ View attachment</button><button className="btn small" onClick={()=>{navigator.clipboard?.writeText(location.href+'#'+n.id);ping('Share link copied')}}>↗ Share</button></div></article>}
function Event({e}){let r=d.regs.find(x=>x.eventId===e.id),spaces=e.total-e.taken,soon=left(e.deadline)<=3;return <article className="card lift"><div className="row"><span className="pill teal">{e.category}</span><span className={'pill '+(!spaces?'red':soon?'amber':'teal')}>{!spaces?'Full':soon?'Closing soon':'Open'}</span></div><h3 className="item">{e.title}</h3><div className="copy">{e.description}</div><div className="meta">◷ {fmt(e.date)} · {e.time} · ⌖ {e.venue} · ♧ {e.organizer}</div><div className="row" style={{marginTop:13,fontSize:10,color:'#64748b'}}>Deadline {fmt(e.deadline)}<b style={{color:'#0f766e'}}>{spaces}/{e.total} spots left</b></div><hr className="divider"/><button className={'btn small '+(r?'danger':'primary')} disabled={!spaces&&!r} onClick={()=>reg(e)}>{r?'Cancel registration':spaces?'Register now':'Event full'}</button>{r&&<button className="btn small" style={{marginLeft:7}} onClick={()=>M({type:'ticket',event:e})}>▦ View pass</button>}</article>}

if(!user)return <AuthScreen authMode={authMode} AM={m=>{AM(m);AE('')}} authError={authError} authenticate={authenticate}/>;
return <><aside className={'sidebar '+(drawer?'open':'')}><div className="brand"><span className="mark">◈</span><span>OnePlace<span style={{color:'#0d9488'}}>.</span><div className="sub" style={{fontSize:9,margin:0}}>CAMPUS HUB</div></span></div><div className="navlabel">Workspace</div>{nav.slice(0,6).map(([k,i,l])=><button className={'nav '+(page===k?'on':'')} key={k} onClick={()=>go(k)}>{i}　{l}</button>)}<div className="navlabel">Account</div>{nav.slice(6).map(([k,i,l])=><button className={'nav '+(page===k?'on':'')} key={k} onClick={()=>go(k)}>{i}　{l}{k==='notifications'&&unread>0?'　'+unread:''}</button>)}<div style={{marginTop:'auto',padding:12,background:'#f8fafc',border:'1px solid #e2e8f0',borderRadius:13}}><b style={{fontSize:11}}>Viewing as {d.role==='student'?'Student':'Admin'}</b><div className="sub">{d.role==='student'?(user?.name+' · '+(user?.department||'Student')+' · '+(user?.year||'')):'Faculty Coordinator'}</div><button className="btn small" style={{width:'100%',marginTop:8}} onClick={role}>⇄ Switch to {d.role==='student'?'Admin':'Student'}</button></div></aside><main className="main"><header className="top"><div style={{display:'flex',alignItems:'center',gap:9,flex:1}}><button className="mobile btn" onClick={()=>Dr(!drawer)} aria-label="Open navigation">☰</button><button className="search" onClick={()=>M({type:'search'})}>⌕　Search campus… <span style={{float:'right'}}>⌘ K</span></button></div><div style={{display:'flex',alignItems:'center',gap:18}}><button className="btn" aria-label="Notifications" onClick={()=>Dr('alerts')}>♧ {unread||''}</button><button className="profile" onClick={()=>M({type:'profile'})}><span className="avatar">{d.role==='student'?(user?.name?.slice(0,1)||'S'):'FC'}</span><span className="profiletext"><b>{d.role==='student'?(user?.name||'Student'):'Faculty Coordinator'}</b><div className="sub" style={{margin:0}}>{d.role==='student'?(user?.department+' · '+user?.year):'Admin · Coordinator'}</div></span>⌄</button></div></header><div className="content">{pageContent()}</div></main><nav className="bottom">{[['dashboard','⌂','Home'],['notices','▤','Notices'],['events','▦','Events'],['saved','♡','Saved'],['notifications','◉','Alerts']].map(([k,i,l])=><button className={page===k?'on':''} key={k} onClick={()=>go(k)}>{i} {l}</button>)}</nav>{drawer==='alerts'&&<div className="modalback" onClick={()=>Dr(false)}><div className="modal" onClick={e=>e.stopPropagation()}><div className="row"><h2 className="section">Notifications</h2><button className="btn" onClick={()=>Dr(false)}>×</button></div>{d.notifications.map(n=><div className="card" key={n.id} style={{marginTop:9}}><div className="row"><b>{n.title}</b>{!n.read&&<span className="pill teal">New</span>}</div><div className="copy">{n.message}</div>{!n.read&&<button className="btn small" onClick={()=>{change(a=>{a.notifications.find(x=>x.id===n.id).read=true;return a});ping('Notification marked read')}}>Mark read</button>}</div>)}<button className="btn primary" style={{marginTop:12}} onClick={()=>{Dr(false);go('notifications')}}>Open notification center</button></div></div>}{modal&&<ModalView/>}{toast&&<div className="toast" role="status">✓　{toast}</div>}</>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
